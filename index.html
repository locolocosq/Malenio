<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b59c3">
<title>Malenio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+Ethiopic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>

<!-- Obere Leiste: Haus links, Telefon rechts -->
<header id="topbar">
  <button id="btn-home" class="icon-btn hidden" aria-label="Menü">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>
  </button>
  <div id="top-center">
    <div id="logo">Malenio</div>
    <div id="game-info" class="hidden">
      <span id="info-round"></span>
      <span id="info-hint"></span>
      <span id="info-timer"></span>
    </div>
  </div>
  <button id="btn-phone" class="icon-btn hidden" aria-label="Telefon">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
  </button>
</header>

<main>
  <!-- 1. Sprache -->
  <section id="screen-lang" class="screen">
    <div class="card center">
      <h1 class="big-title">Malenio</h1>
      <p class="sub">Sprache wählen · ቋንቋ ይምረጡ</p>
      <div class="flags">
        <button class="flag-btn" data-lang="de">
          <svg viewBox="0 0 5 3" class="flag"><rect width="5" height="1" y="0" fill="#000"/><rect width="5" height="1" y="1" fill="#DD0000"/><rect width="5" height="1" y="2" fill="#FFCE00"/></svg>
          <span>Deutsch</span>
        </button>
        <button class="flag-btn" data-lang="am">
          <svg viewBox="0 0 12 6" class="flag">
            <rect width="12" height="2" y="0" fill="#078930"/><rect width="12" height="2" y="2" fill="#FCDD09"/><rect width="12" height="2" y="4" fill="#DA121A"/>
            <circle cx="6" cy="3" r="2" fill="#0F47AF"/>
            <polygon fill="none" stroke="#FCDD09" stroke-width=".16" stroke-linejoin="round" points="6,1.35 6.39,2.46 7.57,2.49 6.63,3.2 6.97,4.33 6,3.66 5.03,4.33 5.37,3.2 4.43,2.49 5.61,2.46"/>
          </svg>
          <span class="am">አማርኛ</span>
        </button>
      </div>
    </div>
  </section>

  <!-- 2. Menü -->
  <section id="screen-menu" class="screen hidden">
    <div class="card center menu-card">
      <h1 class="big-title">Malenio</h1>
      <button id="btn-change-lang" class="lang-chip"></button>
      <label class="lbl" data-i18n="yourName"></label>
      <input id="in-name" maxlength="16" autocomplete="off" data-i18n-ph="namePh">
      <button id="btn-create" class="btn primary" data-i18n="create"></button>
      <div class="divider"><span data-i18n="or"></span></div>
      <input id="in-code" class="code-input" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" inputmode="latin">
      <p class="note" data-i18n="codeNote"></p>
      <button id="btn-join" class="btn green" data-i18n="join"></button>
      <p id="menu-status" class="status"></p>
    </div>
  </section>

  <!-- 3. Lobby -->
  <section id="screen-lobby" class="screen hidden">
    <div class="card lobby-card">
      <div class="code-box">
        <div class="lbl" data-i18n="code"></div>
        <div id="lobby-code" class="code"></div>
        <div class="row">
          <button id="btn-copy" class="btn small" data-i18n="copy"></button>
          <button id="btn-share" class="btn small" data-i18n="share"></button>
        </div>
        <p class="note" data-i18n="lobbyHint"></p>
      </div>
      <h3><span data-i18n="players"></span> <span id="lobby-count"></span></h3>
      <ul id="lobby-players" class="plist"></ul>
      <div id="host-settings" class="hidden">
        <div class="setting">
          <label data-i18n="rounds"></label>
          <select id="set-rounds"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select>
        </div>
        <div class="setting">
          <label data-i18n="drawTime"></label>
          <select id="set-time"><option value="60">60</option><option value="80" selected>80</option><option value="100">100</option><option value="120">120</option><option value="150">150</option><option value="180">180</option></select>
        </div>
        <button id="btn-start" class="btn primary" data-i18n="start"></button>
        <p class="note" data-i18n="hostTip"></p>
      </div>
      <p id="lobby-wait" class="status hidden" data-i18n="waitHost"></p>
    </div>
  </section>

  <!-- 4. Spiel -->
  <section id="screen-game" class="screen hidden">
    <div id="game-layout">
      <ul id="game-players" class="plist"></ul>
      <div id="board-col">
        <div id="board-wrap">
          <canvas id="board" width="800" height="600"></canvas>
          <div id="overlay" class="hidden"></div>
        </div>
        <div id="draw-bar" class="hidden">
          <div id="toolbar">
            <div id="palette"></div>
            <div class="tools">
              <button class="tool size" data-size="4"><i style="width:6px;height:6px"></i></button>
              <button class="tool size active" data-size="10"><i style="width:11px;height:11px"></i></button>
              <button class="tool size" data-size="22"><i style="width:18px;height:18px"></i></button>
              <button class="tool size" data-size="40"><i style="width:26px;height:26px"></i></button>
              <span class="sep"></span>
              <button class="tool" id="tool-brush" data-i18n-title="brush">✏️</button>
              <button class="tool" id="tool-eraser" data-i18n-title="eraser">
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#e8578a" d="M16.2 3.6 21 8.4a2 2 0 0 1 0 2.8l-8.8 8.8H6.5L3 16.5a2 2 0 0 1 0-2.8L13.4 3.6a2 2 0 0 1 2.8 0z"/><path fill="#fff" d="M8.2 8.8 15 15.6 11.6 19H7.3L4.4 16.1z"/><rect x="3" y="20.5" width="18" height="1.6" rx=".8" fill="#555"/></svg>
              </button>
              <button class="tool" id="tool-fill" data-i18n-title="fill">🪣</button>
              <button class="tool" id="tool-undo" data-i18n-title="undo">↩️</button>
              <button class="tool" id="tool-clear" data-i18n-title="clear">🗑️</button>
            </div>
          </div>
          <button id="btn-guessed" class="btn green big" data-i18n="guessed"></button>
        </div>
      </div>
      <div id="chat">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-in" maxlength="60" autocomplete="off" data-i18n-ph="chatPh">
          <button class="btn small" data-i18n="send"></button>
        </form>
      </div>
    </div>
  </section>
</main>

<!-- Dialog -->
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toast" class="hidden"></div>
<div id="audio-sink" class="hidden"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
