<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7b2ff7">
<title>Echo Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+Ethiopic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=92656410">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header id="topbar">
  <button id="btn-home" class="icon-btn hidden" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></button>
  <div id="top-center"><div id="logo">Echo Party</div><div id="game-info" class="hidden"><span id="info-round"></span><span id="info-timer"></span></div></div>
  <button id="btn-stop" class="icon-btn hidden" aria-label="Stopp"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  <button id="btn-sound" class="icon-btn hidden" aria-label="Ton"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
  <button id="btn-phone" class="icon-btn hidden" aria-label="Telefon"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
  <div id="voice-heads"></div>
</header>

<main>
  <!-- Sprache -->
  <section id="screen-lang" class="screen">
    <div class="card center">
      <h1 class="big-title">Echo Party</h1>
      <p class="sub">Sprache wählen · ቋንቋ ይምረጡ</p>
      <div class="flags">
        <button class="flag-btn" data-lang="de"><svg viewBox="0 0 5 3" class="flag"><rect width="5" height="1" fill="#000"/><rect width="5" height="1" y="1" fill="#DD0000"/><rect width="5" height="1" y="2" fill="#FFCE00"/></svg><span>Deutsch</span></button>
        <button class="flag-btn" data-lang="am"><svg viewBox="0 0 12 6" class="flag"><rect width="12" height="2" fill="#078930"/><rect width="12" height="2" y="2" fill="#FCDD09"/><rect width="12" height="2" y="4" fill="#DA121A"/><circle cx="6" cy="3" r="2" fill="#0F47AF"/><polygon fill="none" stroke="#FCDD09" stroke-width=".16" points="6,1.35 6.39,2.46 7.57,2.49 6.63,3.2 6.97,4.33 6,3.66 5.03,4.33 5.37,3.2 4.43,2.49 5.61,2.46"/></svg><span>አማርኛ</span></button>
      </div>
    </div>
  </section>

  <!-- Menü -->
  <section id="screen-menu" class="screen hidden">
    <div class="card center menu-card">
      <h1 class="big-title">Echo Party</h1>
      <div id="menu-char" class="menu-char"></div>
      <button id="btn-edit-char" class="btn small" data-i18n="editChar"></button>
      <input id="in-name" maxlength="14" autocomplete="off" data-i18n-ph="namePh">
      <button id="btn-create" class="btn primary" data-i18n="create"></button>
      <div class="divider"><span data-i18n="or"></span></div>
      <input id="in-code" class="code-input" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE">
      <p class="note" data-i18n="codeNote"></p>
      <button id="btn-join" class="btn green" data-i18n="join"></button>
      <p id="menu-status" class="status"></p>
      <button id="btn-credits" class="linkbtn" data-i18n="credits"></button>
      <button id="btn-reload" class="btn small" data-i18n="reload"></button>
      <p id="ver" class="note"></p>
    </div>
  </section>

  <!-- Figur erstellen -->
  <section id="screen-creator" class="screen hidden">
    <div class="card creator">
      <h2 data-i18n="makeChar"></h2>
      <div id="creator-preview" class="creator-preview"></div>
      <div id="creator-options"></div>
      <div class="row"><button id="btn-random" class="btn" data-i18n="random"></button><button id="btn-char-done" class="btn primary" data-i18n="done"></button></div>
    </div>
  </section>

  <!-- Lobby -->
  <section id="screen-lobby" class="screen hidden">
    <div class="card lobby-card">
      <div class="code-box">
        <div class="lbl" data-i18n="code"></div>
        <div id="lobby-code" class="code"></div>
        <div class="row"><button id="btn-copy" class="btn small" data-i18n="copy"></button><button id="btn-share" class="btn small" data-i18n="share"></button></div>
      </div>
      <h3><span data-i18n="players"></span> <span id="lobby-count"></span></h3>
      <div id="lobby-players" class="char-grid"></div>
      <button id="btn-lobby-char" class="btn small" data-i18n="editChar"></button>
      <div id="host-settings" class="hidden">
        <div class="setting"><label data-i18n="mode"></label><select id="set-mode"><option value="sound" data-i18n="modeSound"></option><option value="draw" data-i18n="modeDraw"></option><option value="guess" data-i18n="modeGuess"></option><option value="logo" data-i18n="modeLogo"></option><option value="timer" data-i18n="modeTimer"></option><option value="hang" data-i18n="modeHang"></option><option value="estimate" data-i18n="modeEst"></option><option value="react" data-i18n="modeReact"></option><option value="simon" data-i18n="modeSimon"></option><option value="memory" data-i18n="modeMemory"></option><option value="cups" data-i18n="modeCups"></option><option value="halve" data-i18n="modeHalve"></option><option value="balance" data-i18n="modeBal"></option><option value="color" data-i18n="modeColor"></option><option value="circle" data-i18n="modeCircle"></option><option value="stack" data-i18n="modeStack"></option><option value="bluff" data-i18n="modeBluff"></option><option value="blind" data-i18n="modeBlind"></option><option value="dish" data-i18n="modeDish"></option><option value="emoji" data-i18n="modeEmoji"></option><option value="mix" data-i18n="modeMix"></option></select></div>
        <div class="setting"><label id="lbl-rounds" data-i18n="rounds"></label><select id="set-rounds"><option>3</option><option selected>5</option><option>8</option><option>10</option><option>15</option></select></div>
        <div id="mix-pick" class="mix-pick hidden"></div>
        <button id="btn-start" class="btn primary" data-i18n="start"></button>
        <p class="note" data-i18n="hostTip"></p>
      </div>
      <p id="lobby-mode" class="lobby-mode hidden"></p>
      <p id="lobby-wait" class="status ok hidden" data-i18n="waitHost"></p>
      <p class="note" data-i18n="micTip"></p>
    </div>
  </section>

  <!-- Spiel -->
  <section id="screen-game" class="screen hidden">
    <div id="stage" class="card stage"></div>
    <div id="emo-bar" class="emo-bar hidden"></div>
    <div id="game-players" class="char-strip"></div>
  </section>
</main>

<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toast" class="hidden"></div>
<div id="audio-sink" class="hidden"></div>
<div id="emo-layer"></div>
<meta id="questions-src" content="questions/questions.js?v=66e24a70">
<meta id="logos-src" content="logos/logos.js?v=7e44a012">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../words.js?v=c54e4e22"></script>
<script src="dish/dishes.js?v=65974f63"></script>
<script src="bluff/bluff.js?v=d717e466"></script>
<script src="emoji/halve.js?v=940c2df3"></script>
<script src="emoji/emoji.js?v=0cd3ae05"></script>
<script src="sounds/sounds.js?v=da5ca81d"></script>
<script src="score.js?v=8e085809"></script>
<script src="game.js?v=82145d6e"></script>
</body>
</html>
